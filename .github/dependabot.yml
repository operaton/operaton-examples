# Dependabot version updates (aligned with operaton/operaton-starter).
#
# Every example under examples/<category>/<name> is a self-contained Maven AND
# Gradle build with its own wrappers, so each ecosystem scans all example
# directories. Groups produce ONE pull request per group across all examples,
# which keeps the pinned versions identical repo-wide (see AGENTS.md).
#
# Auto-merge of eligible PRs is handled by .github/workflows/auto-merge.yml
# according to .github/auto-merge.config.yml. The labels below must exist in
# the repository for the auto-merge rules to match.

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "19 2 * * 1,3,5"
    cooldown:
      default-days: 7
    labels:
      - "dependencies:github-action"
    groups:
      github-actions:
        patterns:
          - "actions/*"
      3rd-party-actions:
        patterns:
          - "*"

  - package-ecosystem: "maven"
    directories:
      - "/examples/*/*"
    schedule:
      interval: "daily"
      time: "01:10"
    cooldown:  # Operaton and Spring Boot patches are wanted immediately (examples track releases)
      default-days: 7
      exclude:
        - "org.operaton*"
        - "org.springframework.boot*"
    labels:
      - "dependencies:maven"
    groups:
      operaton:
        patterns:
          - "org.operaton*"
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"
          - "org.codehaus.mojo*"
      misc:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.operaton*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.springframework.boot*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "io.quarkus*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "gradle"
    directories:
      - "/examples/*/*"
    schedule:
      interval: "daily"
      time: "01:10"
    cooldown:  # Operaton and Spring Boot patches are wanted immediately (examples track releases)
      default-days: 7
      exclude:
        - "org.operaton*"
        - "org.springframework.boot*"
    labels:
      - "dependencies:gradle"
    groups:
      operaton:
        patterns:
          - "org.operaton*"
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      misc:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.operaton*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.springframework.boot*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "io.quarkus*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker-compose"
    directories:
      - "/examples/*/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies:docker"
    groups:
      docker-compose:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directories:
      - "/examples/*/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies:docker"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
