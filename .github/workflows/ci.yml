name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by auto-merge.yml: merges made with GITHUB_TOKEN do not
  # trigger push events, so main would otherwise go unbuilt.
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      maven-examples: ${{ steps.discover.outputs.maven }}
      gradle-examples: ${{ steps.discover.outputs.gradle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" == "pull_request" ]; then
            base_ref="origin/$BASE_REF"
          else
            base_ref="origin/main"
          fi

          # Extract project paths relative to examples/:
          # - examples/core-examples/getting-started/... -> core-examples/getting-started
          # - examples/use-cases/leave-request/...       -> use-cases/leave-request
          # Only keep paths that still contain a Maven wrapper (i.e. real examples).
          changed=$(git diff --name-only --diff-filter=d "$base_ref" 2>/dev/null \
            | awk -F'/' '$1 == "examples" && NF >= 4 { print $2"/"$3 }' \
            | sort -u \
            | while read -r ex; do if [ -f "examples/$ex/mvnw" ]; then echo "$ex"; fi; done \
            | jq -R . | jq -cs .)

          # Fall back to all examples when no example changed (root/workflow change)
          if [ "$changed" = "[]" ]; then
            changed=$(find examples -mindepth 3 -maxdepth 3 -name mvnw \
              | sed -e 's|^examples/||' -e 's|/mvnw$||' \
              | sort -u | jq -R . | jq -cs .)
          fi

          echo "Changed: $changed"

          # Maven: all changed examples (every project has mvnw)
          maven=$(printf '%s' "$changed")
          echo "maven=$maven" >> "$GITHUB_OUTPUT"
          echo "Maven: $maven"

          # Gradle: only whitelisted examples that were changed
          gradle_whitelist='["core-examples/getting-started"]'
          gradle=$(printf '%s' "$changed" | jq -c \
            --argjson wl "$gradle_whitelist" \
            '[.[] | select(. as $e | $wl | any(. == $e))]')
          echo "gradle=$gradle" >> "$GITHUB_OUTPUT"
          echo "Gradle: $gradle"

  # Maven Central rate-limits (HTTP 429) GitHub runners when every matrix job
  # downloads its dependencies, e.g. for Dependabot PRs that change all POMs.
  # This job resolves the dependencies and plugins of all examples once
  # (deduplicated, seeded from the previous cache) for the matrix jobs.
  maven-cache:
    needs: discover
    permissions:
      contents: read
    if: needs.discover.outputs.maven-examples != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-v3-${{ hashFiles('**/pom.xml', '**/maven-wrapper.properties') }}
          restore-keys: maven-v3-
      - name: Resolve dependencies and plugins of all examples
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MAVEN_ARGS: >-
            -Daether.connector.http.retryHandler.count=5
            -Daether.connector.http.retryHandler.interval=15000
            -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504
        # Best effort: anything missed is downloaded by the build job itself.
        # dependency:resolve uses the build's own resolution (incl. dependency
        # management); go-offline resolves unmanaged transitive versions.
        # Surefire/Failsafe resolve their JUnit Platform provider only at test
        # time, so fetch the providers for all effective plugin versions too.
        run: |
          ./mvnw -B -ntp -fae dependency:resolve dependency:resolve-plugins \
            || echo "::warning::Some dependencies could not be resolved up front"
          ./mvnw -B -ntp -q -fae help:effective-pom -Doutput="$RUNNER_TEMP/effective-pom.xml" || true
          versions=$(grep -A1 -E '<artifactId>maven-(surefire|failsafe)-plugin</artifactId>' "$RUNNER_TEMP/effective-pom.xml" \
            | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | sort -u)
          for v in $versions; do
            ./mvnw -B -ntp -q -N dependency:get -Dartifact="org.apache.maven.surefire:surefire-junit-platform:$v" \
              || echo "::warning::Could not resolve surefire-junit-platform $v"
          done
          for v in $(ls ~/.m2/repository/org/junit/platform/junit-platform-engine/ 2>/dev/null); do
            ./mvnw -B -ntp -q -N dependency:get -Dartifact="org.junit.platform:junit-platform-launcher:$v" \
              || echo "::warning::Could not resolve junit-platform-launcher $v"
          done

  build-maven:
    needs: [discover, maven-cache]
    permissions:
      contents: read
    if: needs.discover.outputs.maven-examples != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        example: ${{ fromJson(needs.discover.outputs.maven-examples) }}
    name: ${{ matrix.example }} (maven)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-v3-${{ hashFiles('**/pom.xml', '**/maven-wrapper.properties') }}
          restore-keys: maven-v3-
      - name: Build and test (Maven)
        working-directory: examples/${{ matrix.example }}
        env:
          # Retry transient Maven Central transfer failures (incl. 429/5xx).
          MAVEN_ARGS: >-
            -Daether.connector.http.retryHandler.count=5
            -Daether.connector.http.retryHandler.interval=15000
            -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504
        # Surefire/Failsafe resolve their test providers only at test time, so
        # the warm cache cannot hold them. If the build fails on a Maven
        # Central transfer error (e.g. HTTP 429), wait and retry with -U, which
        # bypasses the cached resolution failure. Test failures fail at once.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            flags=""; [ "$attempt" -gt 1 ] && flags="-U"
            if ./mvnw -B -ntp $flags verify 2>&1 | tee "$RUNNER_TEMP/build.log"; then
              exit 0
            fi
            if ! grep -q "Could not transfer artifact" "$RUNNER_TEMP/build.log"; then
              exit 1
            fi
            echo "::warning::Maven Central transfer failure (attempt $attempt), retrying in 60 s"
            sleep 60
          done
          exit 1

  build-gradle:
    needs: discover
    permissions:
      contents: read
    if: needs.discover.outputs.gradle-examples != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover.outputs.gradle-examples) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build and test (Gradle)
        working-directory: examples/${{ matrix.example }}
        run: ./gradlew build --no-daemon
