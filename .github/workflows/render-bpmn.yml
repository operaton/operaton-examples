name: Render BPMN diagrams

on:
  push:
    paths:
      - '**/*.bpmn'
  workflow_dispatch:

permissions: {}

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the rendered PNGs

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] credentials are needed to push the rendered PNGs
        with:
          # Full history so the auto-commit can push back
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install bpmn-to-image
        run: npm install -g bpmn-to-image@0.10.0  # zizmor: ignore[adhoc-packages] pinned CLI used only for rendering

      - name: Render BPMN files to PNG
        run: bash scripts/render-bpmn.sh

      - name: Commit rendered PNGs
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: 'ci: render BPMN diagrams to PNG [skip ci]'
          file_pattern: '**/*.png'
