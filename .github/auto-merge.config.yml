# Auto-merge configuration (aligned with operaton/operaton-starter)
# Defines which pull requests the auto-merge workflow may approve and squash-merge
# once all checks have passed and no review threads are unresolved.
#
# Rule format:
# - author:   GitHub login of the PR author (e.g. 'dependabot[bot]')
#   labels:   labels that must all be present on the PR (used with includes)
#   includes: title patterns to allow (wildcards with *)
#   excludes: title patterns that override includes (wildcards with *)
#   title:    title pattern, alternative to labels + includes
#
# Major updates are ignored in dependabot.yml. Every example is built and its
# integration tests run against real containers in CI, so a green build is the
# merge criterion for Maven and Gradle updates.

auto-merge-rules:
  - author: 'dependabot[bot]'
    labels: ['dependencies:maven']
    includes:
      - '*'

  - author: 'dependabot[bot]'
    labels: ['dependencies:gradle']
    includes:
      - '*'

  # GitHub Actions from GitHub (actions/*) can be auto-merged
  - author: 'dependabot[bot]'
    labels: ['dependencies:github-action']
    includes:
      - 'actions/*'
      - 'github-actions group'

# Note: 3rd party GitHub Actions (not actions/*) are NOT allowlisted - they require manual review.
# Note: Docker image updates are NOT allowlisted - CI does not exercise docker-compose files.
